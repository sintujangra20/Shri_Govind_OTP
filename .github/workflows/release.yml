name: Android Release Without Secrets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 1. Attestation JSON जनरेट करने के लिए ये अनुमतियाँ ज़रूरी हैं
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Lint and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      # लिंट को बायपास किया ताकि कोड के एरर की वजह से बिल्ड न रुके
      - name: Lint (release)
        run: ./gradlew :app:lintRelease -Pandroid.experimental.lint.recreateGeneratedSrc=false || true

      # बिना किसी सीक्रेट के सीधे डिफ़ॉल्ट साइनिंग से रिलीज़ APK बनाना
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 2. यह स्टेप आपकी APK के लिए "Release attestation (json)" जनरेट करेगा
      - name: Generate Build Attestation JSON
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "app/build/outputs/apk/release/*.apk"

      # अब यह स्टेप बटन (Run workflow) दबाने पर भी सीधे लाइव अपलोड करेगा
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: "v1.0.${{ github.run_number }}"
          name: "App Build v1.0.${{ github.run_number }}"
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
